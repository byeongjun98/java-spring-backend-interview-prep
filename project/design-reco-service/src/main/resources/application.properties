spring.application.name=design-reco-service

spring.r2dbc.url=r2dbc:postgresql://localhost:5432/design_reco
# 실제 계정/비밀번호는 커밋하지 않음 — 환경변수로 주입 (README 참고)
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}

# 로컬 기본값 localhost:6379. 캐시 없이도 (Redis 안 떠 있어도) 첫 커맨드 호출 전엔 접속 안 함 — 개발 중 필수 아님.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
